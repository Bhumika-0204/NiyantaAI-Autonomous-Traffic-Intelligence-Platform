version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: niyanta_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - niyanta_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: niyanta_backend
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_DB_PATH=/app/data/vector_store
    depends_on:
      - redis
    networks:
      - niyanta_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: niyanta_frontend
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend
    networks:
      - niyanta_net

volumes:
  redis_data:

networks:
  niyanta_net:
    driver: bridge
